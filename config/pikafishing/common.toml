			# Range: 0.0 ~ 1.0
			velocity_damping = 0.86

		#传说：判定区范围最宽、冲刺极快
		#Legendary: the widest catch zone with the fastest bursts.
		[minigame.fish_behavior.legendary]
			#两次改变目标位置之间的间隔（刻）
			#Ticks between two target-position decisions.
			# Default: 5
			# Range: 1 ~ 72000
			decision_ticks = 5
			#判定区目标位置的下限（0-1）
