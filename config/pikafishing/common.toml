			# Default: 2.35
			# Range: 0.0 ~ 100.0
			burst_speed_multiplier = 2.35
			#判定区速度的阻尼倍率，越小减速越快
			#Velocity damping multiplier of the catch zone; smaller values slow it down faster.
			# Default: 0.74
			# Range: 0.0 ~ 1.0
			velocity_damping = 0.74

	#神秘宝藏的出现、拾取与经验奖励参数
	#Mystery treasure appearance, pickup, and XP reward settings.
	[minigame.treasure]
		#小游戏中出现神秘宝藏的概率
		#Chance for a mystery treasure to appear during the minigame.
		# Default: 0.1
		# Range: 0.0 ~ 1.0
		appear_chance = 0.1
		#神秘宝藏出现前的最短延迟（刻）
		#Minimum delay in ticks before a mystery treasure appears.
		# Default: 20
		# Range: 0 ~ 72000
		min_delay_ticks = 20
		#神秘宝藏出现前的最长延迟（刻）
		#Maximum delay in ticks before a mystery treasure appears.
		# Default: 60
		# Range: 0 ~ 72000
		max_delay_ticks = 60
		#神秘宝藏的拾取判定宽度（0-1）
		#Pickup hitbox width of the mystery treasure (0-1).
		# Default: 0.09
		# Range: 0.0 ~ 1.0
		hitbox_width = 0.09
		#拾取神秘宝藏时获得的额外钓鱼经验值倍率
