		# Default: 1024
		# Range: > 0
		default_loot_xp_level_8 = 1024
		#鱼获等级 9 的默认钓鱼经验值
		#Default fishing XP for a level 9 catch.
		# Default: 2048
		# Range: > 0
		default_loot_xp_level_9 = 2048

	#各挣扎性格下鱼判定区的移动方式
	#Fish catch-zone movement by behavior.
	[minigame.fish_behavior]
		#所有挣扎性格共用的判定区基础移动速度
		#Base movement speed of the catch zone, shared by every behavior.
		# Default: 0.006
		# Range: 0.0 ~ 1.0
		base_zone_speed = 0.006

		#平静：移动缓慢、停留时间长
		#Calm: the catch zone moves slowly and holds still for longer.
		[minigame.fish_behavior.calm]
			#两次改变目标位置之间的间隔（刻）
			#Ticks between two target-position decisions.
			# Default: 28
			# Range: 1 ~ 72000
			decision_ticks = 28
			#判定区目标位置的下限（0-1）
			#Lower bound of the catch zone target position (0-1).
			# Default: 0.22
			# Range: 0.0 ~ 1.0
			target_min = 0.22
			#判定区目标位置的上限（0-1）
			#Upper bound of the catch zone target position (0-1).
			# Default: 0.78
			# Range: 0.0 ~ 1.0
			target_max = 0.78
			#判定区常规移动的速度倍率
			#Movement speed multiplier of the catch zone under normal movement.
			# Default: 0.55
			# Range: 0.0 ~ 100.0
			speed_multiplier = 0.55
			#判定区冲刺时的速度倍率
			#Movement speed multiplier while the catch zone bursts.
			# Default: 0.55
			# Range: 0.0 ~ 100.0
			burst_speed_multiplier = 0.55
			#判定区速度的阻尼倍率，越小减速越快
			#Velocity damping multiplier of the catch zone; smaller values slow it down faster.
			# Default: 0.86
			# Range: 0.0 ~ 1.0
			velocity_damping = 0.86

		#漂移：判定区持续缓慢漂移
		#Drift: the catch zone keeps drifting slowly.
		[minigame.fish_behavior.drift]
			#两次改变目标位置之间的间隔（刻）
			#Ticks between two target-position decisions.
			# Default: 18
			# Range: 1 ~ 72000
			decision_ticks = 18
			#判定区目标位置的下限（0-1）
			#Lower bound of the catch zone target position (0-1).
			# Default: 0.12
			# Range: 0.0 ~ 1.0
			target_min = 0.12
			#判定区目标位置的上限（0-1）
			#Upper bound of the catch zone target position (0-1).
			# Default: 0.88
			# Range: 0.0 ~ 1.0
			target_max = 0.88
			#判定区常规移动的速度倍率
			#Movement speed multiplier of the catch zone under normal movement.
			# Default: 0.9
			# Range: 0.0 ~ 100.0
			speed_multiplier = 0.9
			#判定区冲刺时的速度倍率
			#Movement speed multiplier while the catch zone bursts.
			# Default: 0.9
			# Range: 0.0 ~ 100.0
			burst_speed_multiplier = 0.9
			#判定区速度的阻尼倍率，越小减速越快
			#Velocity damping multiplier of the catch zone; smaller values slow it down faster.
			# Default: 0.86
			# Range: 0.0 ~ 1.0
			velocity_damping = 0.86

		#冲刺：判定区频繁短距离冲刺
		#Dart: the catch zone makes frequent short dashes.
		[minigame.fish_behavior.dart]
			#两次改变目标位置之间的间隔（刻）
			#Ticks between two target-position decisions.
			# Default: 7
			# Range: 1 ~ 72000
			decision_ticks = 7
			#判定区目标位置的下限（0-1）
			#Lower bound of the catch zone target position (0-1).
			# Default: 0.08
			# Range: 0.0 ~ 1.0
			target_min = 0.08
			#判定区目标位置的上限（0-1）
			#Upper bound of the catch zone target position (0-1).
			# Default: 0.92
			# Range: 0.0 ~ 1.0
			target_max = 0.92
			#判定区常规移动的速度倍率
			#Movement speed multiplier of the catch zone under normal movement.
			# Default: 1.6
			# Range: 0.0 ~ 100.0
			speed_multiplier = 1.6
			#判定区冲刺时的速度倍率
			#Movement speed multiplier while the catch zone bursts.
			# Default: 1.6
			# Range: 0.0 ~ 100.0
			burst_speed_multiplier = 1.6
			#判定区速度的阻尼倍率，越小减速越快
			#Velocity damping multiplier of the catch zone; smaller values slow it down faster.
			# Default: 0.74
			# Range: 0.0 ~ 1.0
			velocity_damping = 0.74

		#紊乱：判定区频繁改变方向
		#Erratic: the catch zone changes direction unpredictably.
		[minigame.fish_behavior.erratic]
			#两次改变目标位置之间的间隔（刻）
			#Ticks between two target-position decisions.
			# Default: 7
			# Range: 1 ~ 72000
			decision_ticks = 7
			#判定区目标位置的下限（0-1）
			#Lower bound of the catch zone target position (0-1).
			# Default: 0.05
			# Range: 0.0 ~ 1.0
			target_min = 0.05
			#判定区目标位置的上限（0-1）
			#Upper bound of the catch zone target position (0-1).
			# Default: 0.95
			# Range: 0.0 ~ 1.0
			target_max = 0.95
			#判定区常规移动的速度倍率
			#Movement speed multiplier of the catch zone under normal movement.
			# Default: 1.5
			# Range: 0.0 ~ 100.0
			speed_multiplier = 1.5
			#判定区冲刺时的速度倍率
			#Movement speed multiplier while the catch zone bursts.
			# Default: 1.5
			# Range: 0.0 ~ 100.0
			burst_speed_multiplier = 1.5
			#判定区速度的阻尼倍率，越小减速越快
