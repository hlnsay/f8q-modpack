[package]
name = "f8q-updater"
version = "0.1.0"
edition = "2021"
description = "Keeps a Minecraft instance's mods and resource packs in step with a published list"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
